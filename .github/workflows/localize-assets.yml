name: Localize game assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace external image URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'https://upforme.ru/uploads/001c/b5/f3/3/165270.png': 'assets/game-title.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/216013.png': 'assets/manor-banner.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/479481.png': 'assets/stats-panel.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/819036.png': 'assets/floor-tile.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/770959.png': 'assets/wall-tile.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/975910.png': 'assets/ghost-1.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/158499.png': 'assets/ghost-2.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/245796.png': 'assets/player-stop.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/55745.png': 'assets/player-stop.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/395114.png': 'assets/player-right.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/314385.png': 'assets/player-left.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/627368.png': 'assets/player-stop.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/177888.png': 'assets/player-back.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/365057.png': 'assets/door.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/203149.png': 'assets/spirit-flame.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/22597.png': 'assets/salt.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/27374.png': 'assets/candle.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/535223.png': 'assets/crystal-ball.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/272821.png': 'assets/third-eye.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/81084.png': 'assets/tarot-card.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/661872.png': 'assets/croissant.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/957576.png': 'assets/coin.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/748204.png': 'assets/ghost-marker.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/690933.png': 'assets/heart-full.png',
              'https://upforme.ru/uploads/001c/b5/f3/3/20508.png': 'assets/heart-dark.png',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit localized paths
        run: |
          if git diff --quiet -- index.html; then
            echo "No external asset URLs remain to replace."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use local game assets"
          git push